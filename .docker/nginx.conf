server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ~* \.html$ {
    add_header Cache-Control 'no-store';
  }

  # These runtime files have stable names, so they must be revalidated after a
  # deployment. Hashed Vite bundles below can safely stay immutable.
  location ~* ^/(?:decoderWorker\.min|encoderWorker\.min|recorder\.min|rlottie-wasm|waveWorker\.min)\.(?:js|wasm)$ {
    expires -1;
    add_header Cache-Control 'no-cache';
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
  }
}
