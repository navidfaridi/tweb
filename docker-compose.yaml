services:
  web:
    container_name: tweb.production
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/Dockerfile_production
      args:
        VITE_MTPROTO_RELAY_URL: ${VITE_MTPROTO_RELAY_URL:-wss://wss.itext.ir}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  relay:
    container_name: tweb.relay
    restart: unless-stopped
    build:
      context: .
      dockerfile: relay/Dockerfile
    environment:
      PORT: 3001
      ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-https://tweb.itext.ir}
      MAX_CONNECTIONS_PER_IP: ${RELAY_MAX_CONNECTIONS_PER_IP:-24}
      MAX_PAYLOAD_BYTES: ${RELAY_MAX_PAYLOAD_BYTES:-16777216}
      MAX_BUFFERED_BYTES: ${RELAY_MAX_BUFFERED_BYTES:-16777216}
      HEARTBEAT_INTERVAL_MS: ${RELAY_HEARTBEAT_INTERVAL_MS:-25000}
      UPSTREAM_CONNECT_TIMEOUT_MS: ${RELAY_UPSTREAM_CONNECT_TIMEOUT_MS:-7000}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: tweb.caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"

volumes:
  caddy_data:
  caddy_config:
