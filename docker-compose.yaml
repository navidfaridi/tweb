version: "3.8"
services:
  tweb.dependencies:
    container_name: tweb.dependencies
    build:
      context: .
      dockerfile: .docker/Dockerfile_dependencies
    volumes:
      - "./node_modules:/app/node_modules"
    command: pnpm install

  tweb.develop:
    container_name: tweb.develop
    build:
      context: .
      dockerfile: .docker/Dockerfile_develop
    volumes:
      - "./:/app"
    ports:
      - 8080:8080
    command: pnpm start-in-docker

  tweb.production:
    container_name: tweb.production
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/Dockerfile_production
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: tweb.caddy
    restart: unless-stopped
    depends_on:
      - tweb.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"

volumes:
  caddy_data:
  caddy_config:
